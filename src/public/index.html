<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDI 시설 신고함</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* 이 화면에만 쓰는 모양 (공통 디자인은 style.css) */
    .form { display: flex; flex-direction: column; gap: 12px; }
    .card { padding: 16px 20px; margin-bottom: 10px; }
    .card .head { display: flex; gap: 10px; align-items: center; }
    .card .title { flex: 1; font-weight: 600; font-size: 15px; }
    .card .meta { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
    .card .foot { display: flex; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .card .foot select { padding: 4px 8px; }
    .card .foot button { padding: 4px 14px; }
    .card .foot button:first-of-type { margin-left: auto; } /* 버튼들은 오른쪽에 모아 둠 */
    /* 안내 줄은 늘 한 줄 높이를 차지해서, 문장이 생기고 사라져도 아래가 밀리지 않음 */
    #error, #list-error { display: block; min-height: 1.5em; }
    #list-error { margin: 0 0 8px; }
    .error.ok { color: var(--green); }
    /* AI 제안 줄 (SPEC 9.1): 제안 배지 · 이유 · [승인] */
    .card .ai { display: flex; gap: 8px; align-items: center; margin: -4px 0 12px; padding: 8px 12px; background: var(--bg); border-radius: 8px; font-size: 13px; }
    .card .ai .reason { flex: 1; min-width: 0; color: var(--muted); }
    .card .ai button { padding: 4px 14px; }
    .card .ai select { padding: 4px 8px; font-size: 13px; }
    .card .ai .tools { color: var(--muted); font-size: 12px; white-space: nowrap; }
    /* 안내문 (SPEC 9.3): 초안이 흘러나오는 글 칸 · 보낸 안내문 */
    .card .notice { display: flex; flex-direction: column; gap: 8px; margin: -4px 0 12px; }
    .card .notice textarea { width: 100%; font-size: 13px; line-height: 1.6; }
    .card .notice .row { align-items: center; }
    .card .notice .msg { flex: 1; color: var(--muted); font-size: 13px; }
    .card .sent { white-space: pre-wrap; }
    /* FAQ 챗봇 (SPEC 9.5): 오른쪽 아래에 떠 있는 창. 크기는 고정이라 말이 늘어도 창은 안 변함 */
    .chat-open { position: fixed; right: 20px; bottom: 20px; z-index: 2; }
    .chat { position: fixed; right: 20px; bottom: 72px; z-index: 2; width: 340px; max-width: calc(100vw - 40px); height: 460px; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(16, 24, 40, .16); }
    .chat[hidden] { display: none; } /* display:flex가 hidden을 이기지 않게 */
    .chat .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; background: var(--bg); }
    .chat .bubble.user { align-self: flex-end; color: #fff; background: var(--accent); }
    .chat .bubble .src { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .chat .hint { margin: 0; color: var(--muted); font-size: 12px; }
    .chat .send { display: flex; gap: 8px; }
    .chat .send input { flex: 1; min-width: 0; }
    .chat .tools { display: flex; align-items: center; justify-content: space-between; }
    #chat-error { min-height: 1.5em; margin: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">SDI</span>
    <nav class="nav"><a href="/" class="on">시설 신고함</a><a href="/misik/">회식 메뉴 가챠</a></nav>
  </header>

  <main class="container">
    <h1 class="page-title">시설 신고함</h1>

    <!-- 새 신고 칸 -->
    <section class="panel">
      <h2>새 신고</h2>
      <form class="form" id="form">
        <label>제목 <input id="title" placeholder="예: 2층 천장에서 물이 샙니다"></label>
        <div class="row">
          <label class="grow">장소 <input id="location" placeholder="예: 사무동 2F 복도"></label>
          <label>건물
            <select id="building">
              <option value="office">사무동</option>
              <option value="plant">생산동</option>
            </select>
          </label>
          <label>설비 번호 (선택) <input id="asset_id" size="10"></label>
        </div>
        <label>내용 (선택) <textarea id="body" rows="2"></textarea></label>
        <div class="row">
          <label class="grow">이름 <input id="reporter_name"></label>
          <button id="submit">신고</button>
        </div>
        <p class="error" id="error"></p>
      </form>
    </section>

    <!-- 상태 탭 -->
    <div class="tabs" id="tabs"></div>

    <p class="error" id="list-error" role="alert"></p>

    <!-- 신고 카드 목록 -->
    <div id="list"><p class="empty">불러오는 중…</p></div>
  </main>

  <!-- FAQ 챗봇: 처음에는 닫혀 있음(hidden) -->
  <button class="chat-open" id="chat-open" aria-expanded="false" aria-controls="chat">FAQ 챗봇</button>
  <section class="chat" id="chat" hidden aria-label="FAQ 챗봇">
    <div class="log" id="chat-log" role="log"></div>
    <p class="error" id="chat-error" role="alert"></p>
    <form class="send" id="chat-form">
      <input id="chat-input" maxlength="500" placeholder="예: 신고는 어떻게 해요?" aria-label="챗봇에게 묻기" autocomplete="off">
      <button id="chat-send">보내기</button>
    </form>
    <div class="tools">
      <p class="hint">AI에게는 최근 10턴만 보냅니다</p>
      <button class="ghost" id="chat-reset" type="button">새 대화</button>
    </div>
  </section>

  <script>
    const SEVERITY = { urgent: "긴급", warning: "주의", info: "정보", none: "미분류" };
    const STATUS = { open: "접수", assigned: "배정", resolved: "완료" };
    const HANDLERS = ["이주임", "최대리", "정사원", "한과장"];
    let reports = [];   // 서버가 준 전체 목록 (급한 순)
    let tab = "";       // 지금 고른 탭 ("" = 전체)
    const classifying = new Set(); // AI 분류를 기다리는 신고 번호
    const recommending = new Set(); // 담당 추천을 기다리는 신고 번호
    const recommends = new Map();   // 신고 번호 → AI 담당 추천 (저장하지 않음 · 새로고침하면 사라짐)
    // 안내문 칸 (한 번에 하나만 열림). 초안은 [보내기] 전까지 화면에만 있음
    const draft = { id: null, text: "", busy: false, msg: "" };

    // 사용자가 쓴 글자를 HTML로 해석하지 않게 바꿈
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    // 시각을 "11/24 09:12" 모양으로
    function formatTime(iso) {
      const d = new Date(iso);
      const two = (n) => String(n).padStart(2, "0");
      return `${d.getMonth() + 1}/${d.getDate()} ${two(d.getHours())}:${two(d.getMinutes())}`;
    }

    const $ = (id) => document.getElementById(id);

    // 서버에 부탁하기. 실패하면 한국어 문장으로 오류를 던짐 (서버가 보낸 문장이 있으면 그대로)
    async function api(method, url, body) {
      let res;
      try {
        res = await fetch(url, {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch {
        throw new Error("서버에 연결하지 못했습니다. 서버가 켜져 있는지 확인해 주세요");
      }
      const data = await res.json().catch(() => {
        throw new Error("서버 응답을 읽지 못했습니다. 서버를 다시 켜 주세요 (npm start)");
      });
      if (!res.ok) throw new Error(data?.error?.message || "요청이 실패했습니다");
      return data;
    }

    // 목록 위 안내 줄 (불러오기 · 배정 · 완료 실패)
    const setListError = (msg) => ($("list-error").textContent = msg);

    // 신고 폼 아래 안내 줄. ok이면 성공 색으로 3초만 보임
    let errorTimer;
    function setError(msg, ok = false) {
      clearTimeout(errorTimer);
      $("error").textContent = msg;
      $("error").className = "error" + (ok ? " ok" : "");
      if (ok) errorTimer = setTimeout(() => setError(""), 3000);
    }

    // clear: 불러오기에 성공하면 목록 위 안내 줄을 비움
    async function load(clear = true) {
      try {
        const rows = await api("GET", "/api/reports");
        if (!Array.isArray(rows)) throw new Error("서버 응답이 예상과 달라요. 서버를 다시 켜 주세요 (npm start)");
        reports = rows;
        if (clear) setListError("");
        render();
      } catch (err) {
        setListError(err.message);
        if (!reports.length) $("list").innerHTML = "";
      }
    }

    function render() {
      // 탭과 건수 (세 탭 건수의 합 = 전체)
      const count = (s) => reports.filter((r) => r.status === s).length;
      const tabs = [["", `전체 ${reports.length}`], ...Object.entries(STATUS).map(([s, name]) => [s, `${name} ${count(s)}`])];
      $("tabs").innerHTML = tabs
        .map(([s, label]) => `<button class="${s === tab ? "on" : ""}" data-tab="${s}" aria-pressed="${s === tab}">${label}</button>`)
        .join("");

      // 카드: 서버가 준 순서 그대로, 고른 탭만
      const shown = reports.filter((r) => !tab || r.status === tab);
      $("list").innerHTML = shown.map(card).join("") || `<p class="empty">신고가 없습니다.</p>`;
    }

    // AI 제안 줄: 제안이 있으면 "AI 제안 (배지) 이유" + 미분류일 때만 [승인] · 제안이 없는 미분류면 [AI 분류]
    // 보류(ai_hold)면 "판단 보류 · 사람 확인 필요"이고 [승인]은 숨김. 완료 전 카드는 사람이 심각도를 직접 고를 수 있음 (SPEC 10.2 · 10.3)
    function aiRow(r) {
      if (r.ai_severity) {
        const held = r.ai_hold === 1;
        const approve = r.severity === "none" && !held ? `<button data-approve="${r.id}">승인</button>` : "";
        const pick = r.status === "resolved" ? "" : `<select data-severity="${r.id}" aria-label="심각도 직접 정하기"><option value="">심각도 고르세요</option>${["urgent", "warning", "info"]
          .map((s) => `<option value="${s}" ${r.severity === s ? "selected" : ""}>${SEVERITY[s]}</option>`).join("")}</select>`;
        return `<div class="ai">${held ? "<b>판단 보류 · 사람 확인 필요</b> " : ""}AI 제안 <span class="badge ${esc(r.ai_severity)}">${SEVERITY[r.ai_severity] || esc(r.ai_severity)}</span>
          <span class="reason">${esc(r.ai_reason)}</span>${approve}${pick}</div>`;
      }
      if (r.severity !== "none") return "";
      const busy = classifying.has(r.id);
      return `<div class="ai"><span class="reason">${busy ? "AI가 신고를 읽는 중…" : "아직 AI 제안이 없습니다"}</span>
        <button class="secondary" data-classify="${r.id}" ${busy ? "disabled" : ""}>AI 분류</button></div>`;
    }

    // 담당 추천 줄 (SPEC 9.2): "추천 한과장 · 이유 · 설비 판단 · 쓴 도구" (접수 상태에서만)
    function recommendRow(r) {
      const rec = recommends.get(r.id);
      if (r.status !== "open" || !rec) return "";
      const asset = rec.asset_advice ? ` · 설비: <b>${esc(rec.asset_advice)}</b>` : "";
      return `<div class="ai">추천 <b>${esc(rec.assignee)}</b>
        <span class="reason">${esc(rec.reason)}${asset}</span>
        <span class="tools">도구: ${rec.tools.map(esc).join(", ") || "없음"}</span></div>`;
    }

    // 안내문 줄: 열려 있으면 글 칸 + [닫기] [보내기] · 아니면 보낸 안내문이 있을 때 그 글
    function noticeRow(r) {
      if (draft.id === r.id) {
        return `<div class="notice">
          <textarea id="notice-text" rows="5" maxlength="1000" ${draft.busy ? "readonly" : ""} aria-label="안내문">${esc(draft.text)}</textarea>
          <div class="row"><span class="msg">${esc(draft.msg)}</span>
            <button class="ghost" data-notice-close="${r.id}">닫기</button>
            <button data-notice-send="${r.id}" ${draft.busy ? "disabled" : ""}>보내기</button></div>
        </div>`;
      }
      return r.notice ? `<div class="ai"><span class="reason sent">보낸 안내문: ${esc(r.notice)}</span></div>` : "";
    }

    // 판단 주체 (SPEC 10.5): 심각도를 [승인]으로 받아들였는지 시설팀이 직접 골랐는지. 서버가 정한 값만 보여 줌 · 빈칸이면 표시 없음
    const JUDGE = { ai: " · 판단: AI 제안 승인", human: " · 판단: 시설팀 직접" };

    function card(r) {
      let foot = "";
      if (r.status === "open") {
        const busy = recommending.has(r.id);
        foot = `담당 <select data-assign="${r.id}"><option value="">고르세요</option>${HANDLERS.map((h) => `<option>${h}</option>`).join("")}</select>
          <button class="secondary" data-recommend="${r.id}" ${busy ? "disabled" : ""}>${busy ? "AI가 찾는 중…" : "담당 추천"}</button>
          <button class="secondary" data-notice="${r.id}">안내문</button>`;
      } else if (r.status === "assigned") {
        foot = `담당: ${esc(r.assignee)} <button class="secondary" data-notice="${r.id}">안내문</button><button data-done="${r.id}">완료</button>`;
      } else {
        foot = `담당: ${esc(r.assignee)}`;
      }
      return `
        <div class="panel card">
          <div class="head">
            <span class="badge ${esc(r.severity)}">${SEVERITY[r.severity] || "미분류"}</span>
            <span class="title">${esc(r.title)}</span>
            <span class="badge ${esc(r.status)}">${STATUS[r.status] || esc(r.status)}</span>
          </div>
          <div class="meta">${esc(r.location)} · ${esc(r.reporter_name)} · ${formatTime(r.created_at)}${JUDGE[r.severity_by] || ""}</div>
          ${aiRow(r)}
          ${recommendRow(r)}
          ${noticeRow(r)}
          <div class="foot">${foot}</div>
        </div>`;
    }

    // 신고하기: 요청하는 동안 [신고]를 꺼서 두 번 눌러도 한 번만 보냄
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const ids = ["title", "location", "building", "asset_id", "body", "reporter_name"];
      const input = Object.fromEntries(ids.map((id) => [id, $(id).value]));
      $("submit").disabled = true;
      setError("");
      try {
        const row = await api("POST", "/api/reports", input);
        e.target.reset();
        if (tab === "assigned" || tab === "resolved") tab = ""; // 새 신고는 '접수'라 이 탭들에서는 안 보임
        setError("신고를 접수했어요", true);
        await load();
        if (row?.id) classify(row.id); // 신고가 접수되면 AI 분류를 자동으로 요청 (기다리지 않음)
      } catch (err) {
        setError(err.message); // 서버가 보낸 문장 그대로
      }
      $("submit").disabled = false;
    });
    // 입력을 고치면 지난 오류 문장은 지움
    $("form").addEventListener("input", () => $("error").textContent && setError(""));

    // 탭 누르기
    $("tabs").addEventListener("click", (e) => {
      if (e.target.dataset.tab === undefined) return;
      tab = e.target.dataset.tab;
      render();
    });

    // 안내문 글 칸을 고치면 초안에 바로 담아 둠
    $("list").addEventListener("input", (e) => {
      if (e.target.id === "notice-text") draft.text = e.target.value;
    });

    // 심각도 직접 고르기 → 순서가 바뀌므로 목록을 다시 받음 (SPEC 10.3)
    // 담당 고르기 → 배정
    $("list").addEventListener("change", async (e) => {
      if (e.target.dataset.severity !== undefined) {
        if (!e.target.value) return;
        e.target.disabled = true;
        setListError("");
        try {
          await api("PATCH", `/api/reports/${e.target.dataset.severity}`, { severity: e.target.value });
        } catch (err) {
          setListError(err.message);
        }
        return load(false);
      }
      const id = e.target.dataset.assign;
      if (!id || !e.target.value) return;
      await change(id, { assignee: e.target.value }, e.target);
    });

    // [완료] · [AI 분류] · [승인] 누르기
    $("list").addEventListener("click", async (e) => {
      const { done, classify: classifyId, approve, recommend, notice, noticeClose, noticeSend } = e.target.dataset;
      if (notice) await draftNotice(Number(notice));
      if (noticeClose) closeNotice();
      if (noticeSend) await sendNotice(Number(noticeSend), e.target);
      if (recommend) await recommendHandler(Number(recommend));
      if (done) await change(done, { status: "resolved" }, e.target);
      if (classifyId) await classify(Number(classifyId));
      if (approve) await approveAi(approve, e.target);
    });

    // AI 분류 제안 받기: 제안 칸만 바뀌므로 그 한 건만 바꿔 넣음 (AI가 멈춰도 신고는 그대로)
    async function classify(id) {
      classifying.add(id);
      render();
      try {
        const row = await api("POST", `/api/reports/${id}/classify`);
        const i = reports.findIndex((r) => r.id === row?.id);
        if (i >= 0) reports[i] = row;
      } catch (err) {
        setListError(err.message); // 서버가 보낸 문장 그대로 (503이면 "AI가 지금 응답하지 않습니다…")
      }
      classifying.delete(id);
      render();
    }

    // [담당 추천]: AI가 도구로 조회해 추천만 함. 배정은 사람이 담당 고르기로 (상태는 접수 그대로)
    async function recommendHandler(id) {
      recommending.add(id);
      setListError("");
      render();
      try {
        const rec = await api("POST", `/api/reports/${id}/recommend`);
        if (!rec?.assignee || !Array.isArray(rec.tools)) throw new Error("서버 응답이 예상과 달라요. 서버를 다시 켜 주세요 (npm start)");
        recommends.set(id, rec);
      } catch (err) {
        setListError(err.message);
      }
      recommending.delete(id);
      render();
    }

    // [안내문]: 초안을 받는 대로 글 칸에 흘려 넣음. 끊겨도 받은 글은 그대로 둠 · 저장은 [보내기]에서만
    async function draftNotice(id) {
      if (draft.busy) return; // 하나를 받는 중이면 기다림
      Object.assign(draft, { id, text: "", busy: true, msg: "AI가 안내문을 쓰는 중…" });
      render();
      let started = false; // 서버가 글을 보내기 시작했는지
      try {
        let res;
        try {
          res = await fetch(`/api/reports/${id}/notice/draft`, { method: "POST" });
        } catch {
          throw new Error("서버에 연결하지 못했습니다. 서버가 켜져 있는지 확인해 주세요");
        }
        if (!res.ok) {
          const data = await res.json().catch(() => null);
          throw new Error(data?.error?.message || "안내문 초안을 받지 못했어요");
        }
        started = true;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          draft.text += decoder.decode(value, { stream: true }); // 한글이 조각 사이에서 깨지지 않게
          const box = $("notice-text");
          if (box) { box.value = draft.text; box.scrollTop = box.scrollHeight; } // 목록 전체를 다시 그리지 않고 글 칸만
        }
        draft.msg = "초안이에요. 고친 뒤 [보내기]를 눌러야 저장돼요";
      } catch (err) {
        draft.msg = started ? "중간에 끊겼어요. 받은 글은 그대로 두었어요" : err.message;
      }
      draft.busy = false;
      render();
    }
    function closeNotice() {
      if (draft.busy) return;
      Object.assign(draft, { id: null, text: "", msg: "" });
      render();
    }
    // [보내기]: 고친 글을 저장. 성공하면 칸을 닫고 카드에 보낸 안내문이 보임
    async function sendNotice(id, button) {
      button.disabled = true;
      try {
        const row = await api("POST", `/api/reports/${id}/notice`, { notice: draft.text });
        const i = reports.findIndex((r) => r.id === row?.id);
        if (i < 0) throw new Error("서버 응답이 예상과 달라요. 서버를 다시 켜 주세요 (npm start)");
        reports[i] = row;
        Object.assign(draft, { id: null, text: "", msg: "" });
      } catch (err) {
        draft.msg = err.message; // 서버가 보낸 문장 그대로 (빈칸 · 1000자 넘음)
      }
      render();
    }

    // [승인]: 심각도가 바뀌면 순서도 바뀌므로 목록을 다시 받음
    async function approveAi(id, button) {
      button.disabled = true;
      setListError("");
      try {
        await api("POST", `/api/reports/${id}/approve`);
      } catch (err) {
        setListError(err.message);
      }
      await load(false);
    }

    // 바뀐 신고 한 건만 받아 그 자리에 바꿔 넣음 (정렬 기준은 안 바뀌므로 목록을 다시 받지 않음)
    async function change(id, fields, control) {
      control.disabled = true; // 요청하는 동안 못 누르게
      setListError("");
      try {
        const row = await api("PATCH", `/api/reports/${id}`, fields);
        const i = reports.findIndex((r) => r.id === row?.id);
        if (i < 0) throw new Error("서버 응답이 예상과 달라요. 서버를 다시 켜 주세요 (npm start)");
        reports[i] = row;
        render();
      } catch (err) {
        setListError(err.message);
        await load(false); // 실패하면 서버 목록으로 다시 맞춤
        control.disabled = false; // 다시 그리지 못했을 때를 위해 (그려졌다면 이미 새 컨트롤)
      }
    }

    // ── FAQ 챗봇 (SPEC 9.5): 대화는 화면 메모리에만 있음 · 새로고침하면 사라짐 ──
    const MAX_MESSAGES = 20; // 서버가 받는 최대 개수와 같음. 이만큼 쌓이면 입력을 끔
    let chat = []; // [{ role, content, sources? }] — sources는 화면에만 쓰고 서버에는 안 보냄
    let chatBusy = false;

    function renderChat() {
      const full = chat.length >= MAX_MESSAGES;
      const log = chat.length
        ? chat.map((m) => {
            const src = m.sources?.length ? `<span class="src">근거: ${m.sources.map((s) => `FAQ ${s.id}. ${esc(s.q)}`).join(" · ")}</span>` : "";
            return `<div class="bubble ${m.role}">${esc(m.content)}${src}</div>`;
          }).join("")
        : `<p class="hint">신고 방법 · 심각도 · 담당자 같은 FAQ를 물어보세요.</p>`;
      $("chat-log").innerHTML = log + (chatBusy ? `<div class="bubble">답을 찾는 중…</div>` : "");
      $("chat-log").scrollTop = $("chat-log").scrollHeight;
      $("chat-input").disabled = full;
      $("chat-send").disabled = chatBusy || full;
      if (full) $("chat-error").textContent = "대화가 길어요. [새 대화]를 눌러 주세요";
    }

    $("chat-open").addEventListener("click", () => {
      const open = $("chat").hidden; // 닫혀 있으면 연다
      $("chat").hidden = !open;
      $("chat-open").setAttribute("aria-expanded", String(open));
      if (open) { renderChat(); $("chat-input").focus(); }
    });

    $("chat-reset").addEventListener("click", () => {
      if (chatBusy) return;
      chat = [];
      $("chat-error").textContent = "";
      renderChat();
    });

    // [보내기]: 대화 전체를 서버로. 실패해도 지금까지의 대화는 남김
    $("chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = $("chat-input").value.trim();
      if (!content || chatBusy || chat.length >= MAX_MESSAGES) return;
      chat.push({ role: "user", content });
      $("chat-input").value = "";
      $("chat-error").textContent = "";
      chatBusy = true;
      renderChat();
      try {
        const out = await api("POST", "/api/chat", { messages: chat.map(({ role, content }) => ({ role, content })) });
        if (typeof out?.answer !== "string" || !Array.isArray(out.sources)) throw new Error("서버 응답이 예상과 달라요. 서버를 다시 켜 주세요 (npm start)");
        chat.push({ role: "assistant", content: out.answer, sources: out.sources });
      } catch (err) {
        $("chat-error").textContent = err.message; // 서버가 보낸 문장 그대로
      }
      chatBusy = false;
      renderChat();
    });

    load();
  </script>
</body>
</html>
